<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #040812;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(5, 10, 20, 0.9);
            padding: 16px 60px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .navbar .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
        }

        .navbar .logo-container i {
            color: #00d4ff;
            filter: drop-shadow(0 0 8px #00d4ff);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: #8a99ad;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #00d4ff;
        }

        .user-auth a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        /* Container */
        .container {
            padding: 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 25px;
            color: #ffffff;
        }

        /* Popular Shows Buttons Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .card {
            position: relative;
            background: rgba(12, 22, 38, 0.85);
            border: 1.5px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 30px 15px 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 160px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
            overflow: hidden;
            text-decoration: none;
        }

        /* Watermark Dragon Effect */
        .card::before {
            content: "\f6d5";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 70px;
            color: rgba(0, 212, 255, 0.08);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            border-color: #00d4ff;
            background: rgba(16, 30, 52, 0.95);
        }

        .card-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 32px;
            color: #8ca8cb;
            filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.3));
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Anime Poster Cards Grid */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .poster-card {
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            cursor: pointer;
        }

        .poster-card:hover {
            transform: scale(1.03);
        }

        .poster-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }

        .poster-title {
            padding: 12px 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background-color: rgba(16, 30, 52, 0.95);
            border-top: 1px solid rgba(0, 212, 255, 0.2);
        }

        @media (max-width: 600px) {
            .navbar { padding: 15px 20px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="logo-container">
            <i class="fa-solid fa-dragon"></i>
            AnimeWorld
        </div>
        
        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Series</a>
            <a href="#">Movies</a>
            <a href="#">Anime</a>
            <a href="#">Cartoons</a>
        </div>

        <div class="user-auth">
            <a href="/logout">Login/Sign Up</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h2 class="section-title">Categories</h2>
        
        <!-- Category Clickable Cards/Buttons -->
        <div class="grid-container">
            <a href="#" class="card">
                <div class="card-icons">
                    <i class="fa-solid fa-house"></i>
                </div>
                <div class="card-title">HOME</div>
            </a>

            <a href="#" class="card">
                <div class="card-icons">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <div class="card-title">SERIES</div>
            </a>

            <a href="#" class="card">
                <div class="card-icons">
                    <i class="fa-solid fa-film"></i>
                </div>
                <div class="card-title">MOVIES</div>
            </a>

            <a href="#" class="card">
                <div class="card-icons">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <div class="card-title">ANIME</div>
            </a>

            <a href="#" class="card">
                <div class="card-icons">
                    <i class="fa-solid fa-face-smile"></i>
                </div>
                <div class="card-title">CARTOONS</div>
            </a>
        </div>

        <!-- Clickable Poster Cards Section -->
        <div class="poster-grid">
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/naruto.jpg') }}" alt="Naruto">
                <div class="poster-title">Naruto</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/pokemon.jpg') }}" alt="Pokémon">
                <div class="poster-title">Pokémon</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/sololeveling.jpg') }}" alt="Solo Leveling">
                <div class="poster-title">Solo Leveling</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/demonslayer.jpg') }}" alt="Demon Slayer">
                <div class="poster-title">Demon Slayer</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/jujutsukaisen.jpg') }}" alt="Jujutsu Kaisen">
                <div class="poster-title">Jujutsu Kaisen</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/doraemon.jpg') }}" alt="Doraemon">
                <div class="poster-title">Doraemon</div>
            </a>
            <a href="#" class="poster-card">
                <img src="{{ url_for('static', filename='image/shinchan.jpg') }}" alt="Shinchan">
                <div class="poster-title">Shinchan</div>
            </a>
        </div>
    </div>

</body>
</html>
